name: Deploy Kiln

on:
  push:
    branches: [main]
    paths:
      - 'kiln/**'
      - '.gitmodules'
      - '.github/workflows/deploy-kiln.yml'
  # Kiln deploys were manual (Coolify UI, building straight from kiln_cms
  # source) before this workflow existed; keep a hand-cranked trigger for
  # redeploys that need no code change here (env var edits, a rebuild against
  # a re-pinned submodule fetched at build time, etc.).
  workflow_dispatch:

concurrency:
  group: deploy-kiln
  cancel-in-progress: true

jobs:
  # --- 1. Build and push Kiln release image -------------------------------------
  build-kiln:
    name: Build & Push Kiln Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      # `kiln/upstream` is the *private* The-Verscienta/kiln_cms repo; the
      # default GITHUB_TOKEN can't clone it. Fail early with instructions
      # instead of an opaque credential prompt from the submodule fetch.
      - name: Require the submodule token
        env:
          KILN_CMS_TOKEN: ${{ secrets.KILN_CMS_TOKEN }}
        run: |
          if [ -z "$KILN_CMS_TOKEN" ]; then
            echo "::error::KILN_CMS_TOKEN is not set. kiln/upstream is the private" \
                 "The-Verscienta/kiln_cms repo; add a fine-grained PAT with Contents:read" \
                 "on BOTH Holistic-Acupuncture and kiln_cms as the repository secret KILN_CMS_TOKEN."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          submodules: true
          token: ${{ secrets.KILN_CMS_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Baked into the image as KILN_BUILD_DATE (see the Dockerfile's build
      # stamp). Computed here rather than taken from the event payload, which
      # carries no build time and is shaped differently for workflow_dispatch.
      - name: Stamp the build date
        id: stamp
        run: echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/holistic-acupuncture-kiln
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest

      # Context is kiln/ — the Dockerfile composes upstream/ + the overlay
      # exactly as a Coolify source build previously would have.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./kiln
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Build stamp read by Kiln.Version / the admin /editor/system page.
          # Without these the page can only report the release version, which
          # never changes between overlay commits.
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ steps.stamp.outputs.date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # --- 2. Trigger Coolify to redeploy ------------------------------------------
  deploy:
    name: Trigger Coolify Deployment
    runs-on: ubuntu-latest
    needs: build-kiln
    environment: production

    steps:
      - name: Trigger Coolify Kiln webhook
        env:
          WEBHOOK_URL: ${{ secrets.COOLIFY_KILN_WEBHOOK_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          if [ -z "${WEBHOOK_URL}" ]; then
            echo "COOLIFY_KILN_WEBHOOK_URL not configured — image pushed, skipping redeploy trigger."
            exit 0
          fi
          response=$(curl -s -o /tmp/coolify_out.txt -w "%{http_code}" \
            -X GET "${WEBHOOK_URL}" \
            -H "Authorization: Bearer ${COOLIFY_TOKEN}" \
            -H "Content-Type: application/json")
          cat /tmp/coolify_out.txt
          echo "HTTP status: ${response}"
          if [ "${response}" -lt 200 ] || [ "${response}" -ge 300 ]; then
            echo "::error::Coolify Kiln webhook failed: ${response}"
            exit 1
          fi

      - name: Write job summary
        run: |
          {
            echo "## Backend Deployed (Kiln CMS)"
            echo "| | |"
            echo "|---|---|"
            echo "| **Image** | \`ghcr.io/${{ github.repository_owner }}/holistic-acupuncture-kiln:latest\` |"
            echo "| **Commit** | \`${{ github.sha }}\` |"
            echo "| **Triggered by** | ${{ github.actor }} |"
            echo "| **Live check** | https://api.verscienta.com/live |"
          } >> "$GITHUB_STEP_SUMMARY"
